# VirtualHost MoreNova — subdominio producción
# Instalar: sudo cp deploy/apache-morenova.conf /etc/httpd/conf/extra/morenova.conf
# y asegurar Include en httpd.conf, luego: sudo apachectl configtest && sudo systemctl reload httpd
#
# DNS: A/CNAME morenova.dematech.com.ar → este servidor
# SSL: preferible terminar HTTPS en el proxy o con certbot/mod_ssl

<VirtualHost *:80>
    ServerAdmin admin@dematech.com.ar
    DocumentRoot "/srv/http/morenova/public"
    ServerName morenova.dematech.com.ar
    ServerAlias www.morenova.dematech.com.ar morenova.local

    ErrorLog "/var/log/httpd/morenova-error_log"
    CustomLog "/var/log/httpd/morenova-access_log" common

    <Directory "/srv/http/morenova/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
